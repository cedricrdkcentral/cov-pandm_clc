name: Fossid Stateless Diff Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to scan (including fork PRs)'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  # Automatic scan for internal PRs (same repo, not a fork)
  fossid-pr:
    name: Fossid Annotate PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: quay.io/fossid/fossid-toolbox:1.5.29
      credentials:
        username: ${{ secrets.FOSSID_CONTAINER_USERNAME }}
        password: ${{ secrets.FOSSID_CONTAINER_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ignore projects file
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/build_tools_workflows
          sparse-checkout: |
            ignore_projects_fossid
          ref: develop
          path: tools

      - name: Run fossid-toolbox
        env:
          FOSSID_HOST_USERNAME: ${{ secrets.FOSSID_HOST_USERNAME }}
          FOSSID_HOST_TOKEN: ${{ secrets.FOSSID_HOST_TOKEN }}
        run: |
          fossid \
            diffscan \
            --fossid-host $FOSSID_HOST_USERNAME \
            --fossid-token $FOSSID_HOST_TOKEN \
            --format github \
            --fail \
            --ignore-projects tools/ignore_projects_fossid

  # Manual scan for any PR (including fork PRs) — resolve refs then scan
  fossid-dispatch:
    name: Fossid Annotate PR (Manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: quay.io/fossid/fossid-toolbox:1.5.29
      credentials:
        username: ${{ secrets.FOSSID_CONTAINER_USERNAME }}
        password: ${{ secrets.FOSSID_CONTAINER_PASSWORD }}
    steps:
      - name: Get PR refs
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.inputs.pr_number }}
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch PR head ref
        run: git fetch origin pull/${{ github.event.inputs.pr_number }}/head

      - name: Checkout ignore projects file
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/build_tools_workflows
          sparse-checkout: |
            ignore_projects_fossid
          ref: develop
          path: tools

      - name: Run fossid-toolbox
        env:
          FOSSID_HOST_USERNAME: ${{ secrets.FOSSID_HOST_USERNAME }}
          FOSSID_HOST_TOKEN: ${{ secrets.FOSSID_HOST_TOKEN }}
        run: |
          fossid \
            diffscan \
            --fossid-host $FOSSID_HOST_USERNAME \
            --fossid-token $FOSSID_HOST_TOKEN \
            --base-ref origin/${{ steps.pr.outputs.base_ref }} \
            --compare-ref ${{ steps.pr.outputs.head_sha }} \
            --format github \
            --fail \
            --ignore-projects tools/ignore_projects_fossid
